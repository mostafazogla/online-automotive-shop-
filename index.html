<style>
  :root{
    --ink:#1C2333; --ink-soft:#2B3350; --paper:#F6F4EF; --card:#FFFFFF;
    --amber:#E2963A; --amber-deep:#C97A20; --rust:#C1502E; --pine:#3E7C59;
    --blue:#3E6C9C; --slate:#6B7280; --line:#E7E3D8; --adspace:56px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Cairo',sans-serif; background:var(--paper); color:var(--ink); -webkit-tap-highlight-color:transparent;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative;}

  header{background:var(--ink); color:#fff; padding:16px 16px 20px; display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;}
  header::after{content:""; position:absolute; left:-40px; top:-50px; width:130px; height:130px; background:var(--amber); opacity:.16; border-radius:50%;}
  .iconbtn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; position:relative; z-index:1;}
  .iconbtn svg{width:19px; height:19px;}
  header h1{font-size:16.5px; font-weight:800; position:relative; z-index:1;}
  header .hsub{font-size:11.5px; color:#C7CCDB; margin-top:2px; position:relative; z-index:1;}

  main{flex:1; padding:16px 16px calc(96px + var(--adspace)); overflow-x:hidden;}
  .stat-row{display:flex; gap:8px; margin-bottom:16px;}
  .stat-pill{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center;}
  .stat-pill b{display:block; font-size:18px; font-weight:800;}
  .stat-pill span{font-size:10.5px; color:var(--slate);}
  .stat-pill.rust b{color:var(--rust);} .stat-pill.amber b{color:var(--amber-deep);} .stat-pill.pine b{color:var(--pine);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .shortcut{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 12px; display:flex; flex-direction:column; gap:8px; text-align:right;}
  .shortcut svg{width:20px; height:20px; color:var(--amber-deep);}
  .shortcut b{font-size:13.5px; font-weight:700;}
  .shortcut span{font-size:11px; color:var(--slate);}

  .section-title{font-size:13.5px; font-weight:700; color:var(--slate); margin:18px 2px 10px; display:flex; align-items:center; gap:8px;}
  .section-title:first-child{margin-top:0;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot.rust{background:var(--rust);} .dot.amber{background:var(--amber);} .dot.pine{background:var(--pine);} .dot.slate{background:var(--slate);} .dot.blue{background:var(--blue);}

  .card{background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:10px; border:1px solid var(--line); box-shadow:0 1px 2px rgba(28,35,51,.04);}
  .card.alert{border-color:#EFC9BA; background:#FFF6F2;}
  .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .row-top .t1{font-weight:700; font-size:15px;} .row-top .t2{font-size:12.5px; color:var(--slate); margin-top:2px;}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:100px; white-space:nowrap;}
  .badge.rust{background:#FBE3DA; color:var(--rust);} .badge.amber{background:#FBEAD3; color:var(--amber-deep);}
  .badge.pine{background:#DCEEE2; color:var(--pine);} .badge.blue{background:#DCE7F2; color:var(--blue);} .badge.slate{background:#E9EAEC; color:var(--slate);}
  .row-meta{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--slate);}
  .row-meta b{color:var(--ink); font-weight:700;}
  .empty{text-align:center; color:var(--slate); font-size:13px; padding:30px 10px; line-height:1.9;}

  .list-row{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:9px;}
  .list-row .main{font-weight:700; font-size:14.5px;} .list-row .sub{font-size:12px; color:var(--slate); margin-top:2px;}
  .mini-btn{font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:100px; border:none; background:var(--ink); color:#fff;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{flex-shrink:0; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:100px; background:var(--card); border:1px solid var(--line); color:var(--slate);}
  .tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .summary-card{background:var(--ink); color:#fff; border-radius:18px; padding:18px; margin-bottom:16px; position:relative; overflow:hidden;}
  .summary-card::after{content:""; position:absolute; left:-30px; bottom:-30px; width:110px; height:110px; background:var(--pine); opacity:.25; border-radius:50%;}
  .summary-card .lbl{font-size:12px; color:#C7CCDB; position:relative;}
  .summary-card .val{font-size:26px; font-weight:800; margin-top:4px; position:relative;}
  .summary-sub{display:flex; gap:14px; margin-top:12px; position:relative;}
  .summary-sub div{font-size:11.5px; color:#C7CCDB;}
  .summary-sub b{display:block; color:#fff; font-size:14px; font-weight:700;}

  nav{position:fixed; bottom:var(--adspace); left:50%; transform:translateX(50%); width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:20;}
  nav button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-family:inherit; font-size:10.5px; color:var(--slate); padding:6px 0; border-radius:12px;}
  nav button.active{color:var(--ink); font-weight:700; background:var(--paper);}
  nav svg{width:20px; height:20px;}

  .fab{position:fixed; bottom:calc(78px + var(--adspace)); left:50%; transform:translateX(calc(-50vw + 30px + 50%)); width:54px; height:54px; border-radius:50%; background:var(--amber); color:#fff; border:none; font-size:26px; box-shadow:0 6px 16px rgba(226,150,58,.45); z-index:20; display:none;}
  .fab.show{display:block;}

  .drawer-overlay{position:fixed; inset:0; background:rgba(20,24,38,.5); display:none; z-index:40;}
  .drawer-overlay.show{display:block;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:78%; max-width:320px; background:#fff; z-index:41; transform:translateX(100%); transition:transform .25s ease; overflow-y:auto; padding:18px 0 30px;}
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:0 18px 16px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .drawer-head b{font-size:15px; font-weight:800;}
  .drawer-head span{font-size:11.5px; color:var(--slate); display:block; margin-top:2px;}
  .dnav-item{display:flex; align-items:center; justify-content:space-between; padding:13px 18px; font-size:14px; font-weight:700; color:var(--ink);}
  .dnav-item svg.chev{width:14px; height:14px; color:var(--slate); transition:transform .2s;}
  .dnav-item.open svg.chev{transform:rotate(-90deg);}
  .dnav-children{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .dnav-children.open{max-height:400px;}
  .dnav-child{padding:11px 18px 11px 18px; margin-right:14px; font-size:13px; color:var(--slate); border-right:2px solid var(--line);}
  .dnav-child.current{color:var(--amber-deep); border-right-color:var(--amber-deep); font-weight:700;}
  .dnav-item.current-parent{color:var(--amber-deep);}
  .dnav-single{cursor:pointer;}

  .overlay{position:fixed; inset:0; background:rgba(20,24,38,.55); display:none; align-items:flex-end; z-index:50;}
  .overlay.show{display:flex;}
  .sheet{background:var(--paper); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:up .22s ease;}
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet h2{font-size:17px; font-weight:800; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--slate); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:#fff; font-family:inherit; font-size:14.5px; color:var(--ink);}
  .field input:focus, .field select:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .btn{width:100%; padding:13px; border-radius:14px; border:none; font-family:inherit; font-weight:700; font-size:14.5px; margin-top:6px;}
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.secondary{background:var(--slate); color:#fff;}
  .btn.ghost{background:none; color:var(--rust); margin-top:14px;}
  .sheet-close{text-align:center; color:var(--slate); font-size:13px; margin-bottom:8px; font-weight:600;}
  .toast{position:fixed; bottom:calc(150px + var(--adspace)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:100px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .notice{background:#FBEAD3; border:1px solid #F0D9AE; color:var(--amber-deep); font-size:12px; border-radius:12px; padding:10px 12px; margin-bottom:14px; line-height:1.7;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
</style>
</head>

<script>
/* ================= تخزين البيانات ================= */
const OLD_KEY = 'carRentalAppData_v1';
const STORAGE_KEY = 'carRentalAppData_v2';
function emptyState(){ return { cars:[], customers:[], bookings:[], contracts:[], maintenance:[], expenses:[], payments:[], ownerPayouts:[], settings:{currency:'ريال', companyName:'MOSTAFA ZOGLA Automotive'} }; }
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = Object.assign(emptyState(), parsed);
      merged.settings = Object.assign(emptyState().settings, parsed.settings||{});
      return merged;
    }
    const old = localStorage.getItem(OLD_KEY);
    if(old){
      const o = JSON.parse(old);
      const s = emptyState();
      s.cars = o.cars || [];
      s.customers = o.customers || [];
      s.contracts = (o.bookings||[]).map(b=>({
        id:b.id, carId:b.carId, customerId:b.customerId, startDate:b.startDate, endDate:b.returnDate,
        dailyRate:0, totalAmount:0, paidAmount:0, status: b.status==='returned' ? 'completed':'active'
      }));
      return s;
    }
  }catch(e){}
  return emptyState();
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  syncToCloud();
}
let state = loadData();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const cur = () => state.settings.currency || 'ريال';
function mergeState(data){
  const merged = Object.assign(emptyState(), data||{});
  merged.settings = Object.assign(emptyState().settings, (data&&data.settings)||{});
  return merged;
}

/* ================= مزامنة سحابية (Firebase Realtime Database) ================= */
const FIREBASE_DB_URL = 'https://zogla-automotive-default-rtdb.firebaseio.com/';
let cloudReady = false;
let syncTimer = null;
function syncToCloud(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{
    fetch(FIREBASE_DB_URL + 'state.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    }).catch(()=>{});
  }, 400);
}
function saveLocalOnly(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function initCloudSync(){
  fetch(FIREBASE_DB_URL + 'state.json')
    .then(r=>r.json())
    .then(data=>{
      cloudReady = true;
      if(data){
        state = mergeState(data);
        saveLocalOnly();
        render();
      } else {
        fetch(FIREBASE_DB_URL + 'state.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(state)}).catch(()=>{});
      }
      listenCloud();
    })
    .catch(()=>{ listenCloud(); });
}
function listenCloud(){
  try{
    const es = new EventSource(FIREBASE_DB_URL + 'state.json');
    es.onopen = ()=>{ cloudReady = true; if(currentView==='settings') render(); };
    es.addEventListener('put', (e)=>{
      try{
        const payload = JSON.parse(e.data);
        if(payload.path === '/' && payload.data){
          state = mergeState(payload.data);
          saveLocalOnly();
          render();
        }
      }catch(err){}
    });
    es.onerror = ()=>{ cloudReady = false; if(currentView==='settings') render(); };
  }catch(e){}
}

/* ================= أدوات تاريخ ================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthStr(){ return todayStr().slice(0,7); }
function dayDiff(dateStr){ const a=new Date(todayStr()+'T00:00:00'), b=new Date(dateStr+'T00:00:00'); return Math.round((b-a)/86400000); }
function fmtDate(dateStr){ return new Date(dateStr+'T00:00:00').toLocaleDateString('ar-EG',{day:'numeric', month:'long'}); }
function fmtMoney(n){ return (Number(n)||0).toLocaleString('ar-EG') + ' ' + cur(); }
function dueLabel(diff){
  if(diff<0) return {text:`متأخر ${Math.abs(diff)} يوم`, cls:'rust'};
  if(diff===0) return {text:'اليوم', cls:'amber'};
  if(diff===1) return {text:'غدًا', cls:'amber'};
  return {text:`بعد ${diff} يوم`, cls:'pine'};
}
function carName(id){ const c=state.cars.find(x=>x.id===id); return c? c.name : 'سيارة محذوفة'; }
function custName(id){ const c=state.customers.find(x=>x.id===id); return c? c.name : 'عميل غير معروف'; }

/* ================= ملكية السيارات ونسبة الشركة ================= */
function carShareInfo(car){
  if(car && car.ownerType==='individual'){
    return {isIndividual:true, ownerName:car.ownerName||'بدون اسم', ownerPhone:car.ownerPhone||'', companyPercent: Number(car.commissionPercent)||0};
  }
  return {isIndividual:false, companyPercent:100};
}
function ownerKeyFor(car){ return (car.ownerName||'بدون اسم') + '|' + (car.ownerPhone||''); }
function splitPayment(payment){
  const contract = state.contracts.find(c=>c.id===payment.contractId);
  const car = contract ? state.cars.find(c=>c.id===contract.carId) : null;
  const info = carShareInfo(car);
  const amount = Number(payment.amount)||0;
  const companyAmount = amount * info.companyPercent/100;
  const ownerAmount = amount - companyAmount;
  return {companyAmount, ownerAmount, car, info};
}
function getOwnersSummary(){
  const map = {};
  state.cars.filter(c=>c.ownerType==='individual').forEach(car=>{
    const key = ownerKeyFor(car);
    if(!map[key]) map[key] = {ownerName:car.ownerName||'بدون اسم', ownerPhone:car.ownerPhone||'', cars:[], earned:0, paidOut:0};
    map[key].cars.push(car);
  });
  state.payments.forEach(p=>{
    const {ownerAmount, car} = splitPayment(p);
    if(car && car.ownerType==='individual'){
      const key = ownerKeyFor(car);
      if(map[key]) map[key].earned += ownerAmount;
    }
  });
  (state.ownerPayouts||[]).forEach(op=>{ if(map[op.ownerKey]) map[op.ownerKey].paidOut += Number(op.amount||0); });
  return Object.entries(map).map(([key,v])=>Object.assign({key}, v, {pending: v.earned - v.paidOut}));
}

/* ================= عقود الإيجار الشهري ================= */
function monthlyCycle(contract, ref){
  ref = ref || todayStr();
  const start = new Date(contract.startDate+'T00:00:00');
  const now = new Date(ref+'T00:00:00');
  let cycleStart = new Date(start);
  while(true){
    let next = new Date(cycleStart); next.setMonth(next.getMonth()+1);
    if(next > now) break;
    cycleStart = next;
  }
  let cycleEnd = new Date(cycleStart); cycleEnd.setMonth(cycleEnd.getMonth()+1);
  const cycleStartStr = cycleStart.toISOString().slice(0,10);
  const cycleEndStr = cycleEnd.toISOString().slice(0,10);
  const paid = state.payments.filter(p=>p.contractId===contract.id && p.date>=cycleStartStr && p.date<cycleEndStr).reduce((s,p)=>s+Number(p.amount||0),0);
  const rate = Number(contract.monthlyRate||0);
  return {cycleStart:cycleStartStr, cycleEnd:cycleEndStr, paid, isPaid: rate>0 && paid>=rate};
}

/* ================= الإيجار اليومي المفتوح ================= */
function daysElapsedOpen(contract, ref){
  ref = ref || todayStr();
  const start = new Date(contract.startDate+'T00:00:00');
  const now = new Date(ref+'T00:00:00');
  const diff = Math.round((now-start)/86400000);
  return Math.max(1, diff+1);
}
function dailyOpenSummary(contract){
  const days = daysElapsedOpen(contract);
  const rate = Number(contract.dailyRate||0);
  const totalDue = days*rate;
  const paid = state.payments.filter(p=>p.contractId===contract.id).reduce((s,p)=>s+Number(p.amount||0),0);
  return {days, totalDue, paid, balance: totalDue - paid};
}

/* ================= إشعارات ================= */
let notifiedKeys = new Set(JSON.parse(localStorage.getItem('notifiedKeys')||'[]'));
function askNotifPermission(){ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }
function checkAndNotify(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  state.contracts.forEach(c=>{
    if(c.status!=='active') return;
    if(c.type==='monthly'){
      const cyc = monthlyCycle(c);
      if(!cyc.isPaid){
        const key = c.id+'_'+cyc.cycleStart;
        if(!notifiedKeys.has(key)){
          new Notification('دفعة شهرية مستحقة', {body:`${carName(c.carId)} - ${custName(c.customerId)}`});
          notifiedKeys.add(key); localStorage.setItem('notifiedKeys', JSON.stringify([...notifiedKeys]));
        }
      }
      return;
    }
    if(c.type==='daily_open') return;
    const diff = dayDiff(c.endDate);
    if(diff<=0){
      const key = c.id+'_'+c.endDate;
      if(!notifiedKeys.has(key)){
        new Notification('موعد استلام سيارة', {body:`${carName(c.carId)} - ${custName(c.customerId)} : ${diff===0?'اليوم':'متأخر '+Math.abs(diff)+' يوم'}`});
        notifiedKeys.add(key); localStorage.setItem('notifiedKeys', JSON.stringify([...notifiedKeys]));
      }
    }
  });
}

/* ================= التنقل الرئيسي ================= */
const NAV_TREE = [

  ]},

];
const VIEW_TITLES = {
  home:['الرئيسية',''], cars_all:['السيارات','كل السيارات'], cars_rented:['السيارات','المؤجرة'],
  cars_available:['السيارات','المتاحة'], cars_maintenance:['السيارات','في الصيانة'],
  customers_all:['العملاء',''], rental_active:['التأجير','العقود الحالية'], rental_done:['التأجير','العقود المنتهية'],
  rental_return:['التأجير','إرجاع سيارة'], bookings:['الحجوزات',''], owners:['ملاك السيارات',''], maintenance:['الصيانة',''],
  finance_revenue:['الحسابات','الإيرادات'], finance_expenses:['الحسابات','المصروفات'],
  finance_payments:['الحسابات','المدفوعات'], finance_profit:['الحسابات','الأرباح'],
  reports:['التقارير',''], settings:['الإعدادات',''],
};
const BOTTOM_MAP = {home:'home', cars_all:'cars_all', cars_rented:'cars_all', cars_available:'cars_all', cars_maintenance:'cars_all',
  rental_active:'rental_active', rental_done:'rental_active', rental_return:'rental_active',

  settings:'settings'};
const FAB_MAP = {

  bookings:()=>openBookingForm(), maintenance:()=>openMaintenanceForm(),

};

let currentView = 'home';
function setView(view){
  currentView = view;
  const t = VIEW_TITLES[view] || [view,''];
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.view === (BOTTOM_MAP[view]||view)));
  const fab = document.getElementById('fabAdd');
  if(FAB_MAP[view]){ fab.classList.add('show'); fab.onclick = FAB_MAP[view]; }
  else fab.classList.remove('show');
  render();
  closeDrawer();
}
document.querySelectorAll('nav button').forEach(b=> b.addEventListener('click', ()=> setView(b.dataset.view)));

/* ================= الدرج الجانبي ================= */
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
function buildDrawer(){
  let html = `<div class="drawer-head"><b>${state.settings.companyName || 'إدارة تأجير السيارات'}</b><span>القائمة الرئيسية</span></div>`;
  NAV_TREE.forEach(item=>{
    if(item.leaf){
      html += `<div class="dnav-item dnav-single" data-go="${item.key}">${item.label}</div>`;
    } else {
      html += `<div class="dnav-item dnav-single" data-toggle="${item.key}"><span>${item.label}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></div>`;
      html += `<div class="dnav-children" id="dch_${item.key}">`;
      item.children.forEach(ch=>{
        html += `<div class="dnav-child" data-go="${ch.key}" data-hasaction="${ch.action?1:0}">${ch.label}</div>`;
      });
      html += `</div>`;
    }
  });
  drawer.innerHTML = html;
  drawer.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.toggle;
      const ch = document.getElementById('dch_'+key);
      const isOpen = ch.classList.contains('open');
      drawer.querySelectorAll('.dnav-children.open').forEach(c=>c.classList.remove('open'));
      drawer.querySelectorAll('.dnav-item.open').forEach(c=>c.classList.remove('open'));
      if(!isOpen){ ch.classList.add('open'); el.classList.add('open'); }
    });
  });
  drawer.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.go;
      let found=null;
      NAV_TREE.forEach(it=>{ if(it.key===key) found=it; if(it.children) it.children.forEach(c=>{ if(c.key===key) found=c; }); });
      if(found && found.action){ closeDrawer(); found.action(); }
      else setView(key);
    });
  });
}
function openDrawer(){ buildDrawer(); drawer.classList.add('show'); drawerOverlay.classList.add('show'); }
function closeDrawer(){ drawer.classList.remove('show'); drawerOverlay.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', openDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

/* ================= عناصر مساعدة للعرض ================= */
function contractBadge(c){
  if(c.status==='completed') return {text:'منتهي', cls:'slate'};
  if(c.type==='monthly'){
    const cyc = monthlyCycle(c);
    return cyc.isPaid ? {text:'مدفوع هذا الشهر', cls:'pine'} : {text:'دفعة مستحقة', cls:'amber'};
  }
  if(c.type==='daily_open'){
    const s = dailyOpenSummary(c);
    return s.balance>0 ? {text:'مستحق '+fmtMoney(s.balance), cls:'amber'} : {text:'مسدد بالكامل', cls:'pine'};
  }
  const d = dayDiff(c.endDate);
  const dl = dueLabel(d);
  return dl;
}
function contractCard(c){
  const badge = contractBadge(c);
  const isMonthly = c.type==='monthly';
  const isOpen = c.type==='daily_open';
  const cyc = isMonthly ? monthlyCycle(c) : null;
  const os = isOpen ? dailyOpenSummary(c) : null;
  const alert = c.status==='active' && ((!isMonthly && !isOpen && dayDiff(c.endDate)<=0) || (isMonthly && !cyc.isPaid) || (isOpen && os.balance>0)) ? 'alert':'';
  const car = findCar(c.carId);
  return `
  <div class="card ${alert}" onclick="openContractDetail('${c.id}')">
    <div class="row-top">
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        ${carThumb(car, 40)}
        <div style="min-width:0;"><div class="t1">${carName(c.carId)}</div><div class="t2">${custName(c.customerId)}${isMonthly?' · إيجار شهري':''}${isOpen?' · إيجار يومي مفتوح':''}</div></div>
      </div>
      <span class="badge ${badge.cls}">${badge.text}</span>
    </div>
    ${isMonthly ? `
    <div class="row-meta"><span>بداية العقد: <b>${fmtDate(c.startDate)}</b></span><span>التجديد القادم: <b>${fmtDate(cyc.cycleEnd)}</b></span></div>
    <div class="row-meta"><span>الإيجار الشهري: <b>${fmtMoney(c.monthlyRate)}</b></span><span>مدفوع هذا الشهر: <b>${fmtMoney(cyc.paid)}</b></span></div>
    ` : isOpen ? `
    <div class="row-meta"><span>بداية الإيجار: <b>${fmtDate(c.startDate)}</b></span><span>عدد الأيام: <b>${os.days}</b></span></div>
    <div class="row-meta"><span>الإجمالي المستحق: <b>${fmtMoney(os.totalDue)}</b></span><span>المتبقي: <b>${fmtMoney(os.balance)}</b></span></div>
    ` : `
    <div class="row-meta"><span>تسليم: <b>${fmtDate(c.startDate)}</b></span><span>استلام: <b>${fmtDate(c.endDate)}</b></span></div>
    ${c.totalAmount? `<div class="row-meta"><span>الإجمالي: <b>${fmtMoney(c.totalAmount)}</b></span><span>المدفوع: <b>${fmtMoney(c.paidAmount)}</b></span></div>`:''}
    `}
    ${c.kmLimit? `<div class="row-meta"><span>حد الكيلومترات: <b>${c.kmLimit} كم</b></span>${c.startOdometer?`<span>عداد التسليم: <b>${c.startOdometer}</b></span>`:''}</div>`:''}
  </div>`;
}

/* ================= صفحة الرئيسية ================= */
function renderHome(){
  const activeContracts = state.contracts.filter(c=>c.status==='active');
  const dailyActive = activeContracts.filter(c=>c.type!=='monthly' && c.type!=='daily_open');
  const monthlyActive = activeContracts.filter(c=>c.type==='monthly');
  const openActive = activeContracts.filter(c=>c.type==='daily_open');
  const overdue = dailyActive.filter(c=>dayDiff(c.endDate)<0).length;
  const dueToday = dailyActive.filter(c=>dayDiff(c.endDate)===0).length;
  const monthlyUnpaid = monthlyActive.filter(c=>!monthlyCycle(c).isPaid).length;
  const openBalanceTotal = openActive.reduce((s,c)=>s+dailyOpenSummary(c).balance,0);
  const avail = state.cars.filter(c=>c.status==='available').length;

  let html = `<div class="section-title" style="margin-bottom:14px;"><span class="dot amber"></span>${state.settings.companyName || 'إدارة تأجير السيارات'}</div>`;
  html += `<div class="stat-row">
    <div class="stat-pill rust"><b>${overdue}</b><span>متأخرة</span></div>
    <div class="stat-pill amber"><b>${dueToday}</b><span>اليوم</span></div>
    <div class="stat-pill pine"><b>${avail}</b><span>سيارات متاحة</span></div>
  </div>`;
  if(monthlyActive.length){
    html += `<div class="stat-row"><div class="stat-pill amber"><b>${monthlyUnpaid}</b><span>عقود شهرية بدون دفع</span></div><div class="stat-pill"><b>${monthlyActive.length}</b><span>عقود شهرية نشطة</span></div></div>`;
  }
  if(openActive.length){
    html += `<div class="stat-row"><div class="stat-pill amber"><b>${fmtMoney(openBalanceTotal)}</b><span>مستحق من إيجارات مفتوحة</span></div><div class="stat-pill"><b>${openActive.length}</b><span>عقود يومية مفتوحة</span></div></div>`;
  }

  html += `<div class="grid2">
    ${shortcut('cars_all','السيارات', state.cars.length+' سيارة', 'car')}
    ${shortcut('customers_all','العملاء', state.customers.length+' عميل', 'user')}
    ${shortcut('rental_active','عقود التأجير', activeContracts.length+' عقد نشط', 'doc')}
    ${shortcut('bookings','الحجوزات', state.bookings.filter(b=>b.status!=='cancelled').length+' حجز', 'cal')}
  </div>`;

function compressImage(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h*(maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function carThumb(c, size){
  size = size || 44;
  if(c && c.photo) return `<img src="${c.photo}" style="width:${size}px; height:${size}px; object-fit:cover; border-radius:10px; flex-shrink:0;">`;
  return `<div style="width:${size}px; height:${size}px; border-radius:10px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg viewBox="0 0 24 24" width="${Math.round(size*0.45)}" height="${Math.round(size*0.45)}" fill="none" stroke="var(--slate)" stroke-width="2"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13v5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></svg></div>`;
}

function wirePhotoField(id, setCurrent){
  const preview = document.getElementById(id+'_preview');
  async function handleFile(file){
    if(!file) return;
    try{
      const dataUrl = await compressImage(file, 900, 0.72);
      setCurrent(dataUrl);
      preview.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover;">`;
    }catch(e){ showToast('تعذر تحميل الصورة'); }
  }
  document.getElementById(id+'_cam').addEventListener('change', e=>handleFile(e.target.files[0]));
  document.getElementById(id+'_gal').addEventListener('change', e=>handleFile(e.target.files[0]));
  const removeBtn = document.getElementById(id+'_remove');
  if(removeBtn) removeBtn.onclick = ()=>{ setCurrent(null); preview.innerHTML = 'لا توجد صورة بعد'; };
}

    html += `<div class="summary-card"><div class="lbl">صافي ربح الشركة</div><div class="val">${fmtMoney(profit)}</div>
      <div class="summary-sub"><div>نصيب الشركة<b>${fmtMoney(companyRevenue)}</b></div><div>المصروفات<b>${fmtMoney(totalExpenses)}</b></div>${hasOwnerCars?`<div>مستحق للملاك<b>${fmtMoney(ownersShare)}</b></div>`:''}</div></div>`;
    html += `<div class="section-title"><span class="dot slate"></span>هذا الشهر</div>`;
    const m = monthStr();
    const monthRev = state.payments.filter(p=>p.date.startsWith(m)).reduce((s,p)=>s+splitPayment(p).companyAmount,0);
    const monthExp = state.expenses.filter(e=>e.date.startsWith(m)).reduce((s,e)=>s+Number(e.amount||0),0) + state.maintenance.filter(mm=>mm.date.startsWith(m)).reduce((s,mm)=>s+Number(mm.cost||0),0);
    html += `<div class="stat-row"><div class="stat-pill pine"><b>${fmtMoney(monthRev)}</b><span>نصيب الشركة هذا الشهر</span></div><div class="stat-pill rust"><b>${fmtMoney(monthExp)}</b><span>مصروفات الشهر</span></div></div>`;
  }
  document.getElementById('main').innerHTML = html;
}

/* ================= ملاك السيارات ================= */

function openOwnerPayoutForm(ownerKey){

  if(!o) return;
  sheet.innerHTML = `
    <div class="sheet-close">— دفعة للمالك —</div>
    <h2>${o.ownerName}</h2>
    <div class="field"><label>المستحق حاليًا</label><input value="${fmtMoney(o.pending)}" disabled></div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input type="date" id="f_opDate" value="${todayStr()}"></div>
      <div class="field"><label>المبلغ (${cur()})</label><input type="number" id="f_opAmount" value="${o.pending}"></div>
    </div>
    <button class="btn primary" id="saveOwnerPayout">حفظ الدفعة</button>`;
  overlay.classList.add('show');
  document.getElementById('saveOwnerPayout').onclick = ()=>{
    const date = document.getElementById('f_opDate').value || todayStr();
    const amount = Number(document.getElementById('f_opAmount').value)||0;
    if(amount<=0){ showToast('أدخل مبلغًا صحيحًا'); return; }
    state.ownerPayouts = state.ownerPayouts || [];
    state.ownerPayouts.push({id:uid(), ownerKey, amount, date});
    saveData(); closeSheet(); render(); showToast('تم تسجيل الدفعة');
  };
}

/* ================= التقارير ================= */
function renderReports(){
  const activeContracts = state.contracts.filter(c=>c.status==='active').length;
  const completedContracts = state.contracts.filter(c=>c.status==='completed').length;
  const companyRevenue = state.payments.reduce((s,p)=>s+splitPayment(p).companyAmount,0);
  const totalExpenses = state.expenses.reduce((s,e)=>s+Number(e.amount||0),0) + state.maintenance.reduce((s,m)=>s+Number(m.cost||0),0);
  const overdue = state.contracts.filter(c=>c.status==='active' && c.type!=='monthly' && c.type!=='daily_open' && dayDiff(c.endDate)<0).length;
  const counts = {};
  state.contracts.forEach(c=>{ counts[c.carId] = (counts[c.carId]||0)+1; });
  let topCarId=null, topCount=0;
  Object.entries(counts).forEach(([id,n])=>{ if(n>topCount){topCount=n; topCarId=id;} });

  let html = `<div class="summary-card"><div class="lbl">صافي ربح الشركة الإجمالي</div><div class="val">${fmtMoney(companyRevenue-totalExpenses)}</div></div>`;
  html += `<div class="grid2">
    <div class="shortcut"><b>${state.cars.length}</b><span>إجمالي السيارات</span></div>
    <div class="shortcut"><b>${state.customers.length}</b><span>إجمالي العملاء</span></div>
    <div class="shortcut"><b>${activeContracts}</b><span>عقود نشطة</span></div>
    <div class="shortcut"><b>${completedContracts}</b><span>عقود منتهية</span></div>
    <div class="shortcut"><b style="color:var(--rust)">${overdue}</b><span>عقود متأخرة</span></div>
    <div class="shortcut"><b>${topCarId? carName(topCarId):'—'}</b><span>الأكثر تأجيرًا</span></div>
  </div>`;
  document.getElementById('main').innerHTML = html;
}

/* ================= الإعدادات ================= */
function renderSettings(){
  let html = `
    <div class="section-title"><span class="dot ${cloudReady?'pine':'slate'}"></span>${cloudReady? 'المزامنة السحابية مفعّلة — بياناتك مشتركة بين كل الأجهزة':'المزامنة غير مفعّلة — البيانات محفوظة على هذا الجهاز فقط'}</div>
    <div class="section-title"><span class="dot slate"></span>عام</div>
    <div class="card">
      <div class="field"><label>اسم الشركة/المعرض</label><input id="f_companyName" value="${state.settings.companyName||''}" placeholder="مثال: MOSTAFA ZOGLA Automotive"></div>
      <div class="field"><label>رمز العملة</label><input id="f_currency" value="${cur()}"></div>
      <button class="btn primary" id="saveCurrency">حفظ</button>
    </div>
    <div class="section-title"><span class="dot slate"></span>البيانات</div>
    <div class="card">
      <button class="btn secondary" id="exportBtn">تصدير نسخة احتياطية (JSON)</button>
      <button class="btn secondary" id="importBtn" style="margin-top:10px;">استيراد نسخة احتياطية</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn ghost" id="resetBtn">تصفير كل البيانات</button>
    </div>`;
  document.getElementById('main').innerHTML = html;
  document.getElementById('saveCurrency').onclick = ()=>{
    state.settings.currency = document.getElementById('f_currency').value.trim() || 'ريال';
    state.settings.companyName = document.getElementById('f_companyName').value.trim() || 'MOSTAFA ZOGLA Automotive';
    saveData(); showToast('تم حفظ الإعدادات'); render();
  };
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'car-rental-backup-'+todayStr()+'.json';
    a.click();
  };
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        state = Object.assign(emptyState(), data);
        saveData(); showToast('تم استيراد البيانات'); render();
      }catch(err){ showToast('ملف غير صالح'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('هل أنت متأكد من حذف كل البيانات؟ لا يمكن التراجع.')){
      state = emptyState(); saveData(); showToast('تم تصفير البيانات'); render();
    }
  };
}

/* ================= موزّع العرض ================= */
function render(){
  switch(currentView){
    case 'home': return renderHome();
    case 'cars_all': return renderCars(null);
    case 'cars_available': return renderCars('available');
    case 'cars_rented': return renderCars('rented');
    case 'cars_maintenance': return renderCars('maintenance');
    case 'customers_all': return renderCustomers();
    case 'rental_active': return renderRental('active');
    case 'rental_done': return renderRental('completed');
    case 'rental_return': return renderReturn();
    case 'bookings': return renderBookings();
    case 'owners': return renderOwners();
    case 'maintenance': return renderMaintenance();
    case 'finance_revenue': return renderFinance('revenue');
    case 'finance_expenses': return renderFinance('expenses');
    case 'finance_payments': return renderFinance('payments');
    case 'finance_profit': return renderFinance('profit');
    case 'reports': return renderReports();
    case 'settings': return renderSettings();
    default: return renderHome();
  }
}

      <div class="field"><label>اسم المالك</label><input id="f_carOwnerName" value="${car&&car.ownerName?car.ownerName:''}"></div>
      <div class="row2">
        <div class="field"><label>جوال المالك (اختياري)</label><input id="f_carOwnerPhone" value="${car&&car.ownerPhone?car.ownerPhone:''}"></div>

  let currentPhoto = (car && car.photo) ? car.photo : null;

/* --- عقد تأجير --- */
function openContractForm(contract, prefill){
  const editing = !!contract;
  if(state.cars.length===0 || state.customers.length===0){
    showToast('أضف سيارة وعميل أولًا'); return;
  }
  const p = contract || prefill || {};
  const type = p.type || 'daily';
  const carsOpts = state.cars.map(c=>`<option value="${c.id}" ${p.carId===c.id?'selected':''}>${c.name}${c.plate?' — '+c.plate:''}</option>`).join('');
  const custOpts = state.customers.map(c=>`<option value="${c.id}" ${p.customerId===c.id?'selected':''}>${c.name}</option>`).join('');
  sheet.innerHTML = `
    <div class="sheet-close">— عقد تأجير —</div>
    <h2>${editing?'تعديل عقد':'إنشاء عقد تأجير'}</h2>
    <div class="field"><label>نوع العقد</label><select id="f_cType" ${editing?'disabled':''}>
      <option value="daily" ${type==='daily'?'selected':''}>يومي (بتاريخ استلام محدد)</option>
      <option value="daily_open" ${type==='daily_open'?'selected':''}>يومي مفتوح (يتجدد يوميًا حتى الإنهاء)</option>
      <option value="monthly" ${type==='monthly'?'selected':''}>شهري (يتجدد تلقائيًا)</option>
    </select></div>
    <div class="field"><label>السيارة</label><select id="f_cCar">${carsOpts}</select></div>
    <div class="field"><label>العميل</label><select id="f_cCust">${custOpts}</select></div>
    <div class="field"><label id="f_cStartLabel">تاريخ التسليم</label><input type="date" id="f_cStart" value="${p.startDate||todayStr()}"></div>

    <div id="dailyFields">
      <div class="row2">
        <div class="field"><label>تاريخ الاستلام المتوقع</label><input type="date" id="f_cEnd" value="${p.endDate||''}"></div>
        <div class="field"><label>السعر اليومي (${cur()})</label><input type="number" id="f_cRate" value="${p.dailyRate||''}"></div>
      </div>
      <div class="field"><label>الإجمالي (${cur()})</label><input type="number" id="f_cTotal" value="${p.totalAmount||''}"></div>
    </div>

    <div id="openFields" style="display:none;">
      <div class="field"><label>السعر اليومي (${cur()})</label><input type="number" id="f_cOpenRate" value="${p.dailyRate||''}"></div>
      <div class="notice">العقد يستمر بدون تاريخ استلام محدد، ويحسب البرنامج الإجمالي المستحق تلقائيًا (عدد الأيام × السعر اليومي) حتى تنهيه من "التأجير → إرجاع سيارة".</div>
    </div>

    <div id="monthlyFields" style="display:none;">
      <div class="field"><label>الإيجار الشهري (${cur()})</label><input type="number" id="f_cMonthly" value="${p.monthlyRate||''}"></div>
      <div class="notice">العقد يتجدد تلقائيًا كل شهر من تاريخ البداية، والبرنامج يتابع حالة الدفع لكل شهر لحاله.</div>
    </div>

    <div class="row2">
      <div class="field"><label>قراءة العداد عند التسليم (اختياري)</label><input type="number" id="f_cStartOdo" value="${p.startOdometer||''}"></div>
      <div class="field"><label>الحد الأقصى للكيلومترات (اختياري)</label><input type="number" id="f_cKmLimit" value="${p.kmLimit||''}"></div>
    </div>

    <div class="field"><label>المدفوع مقدمًا (${cur()})</label><input type="number" id="f_cPaid" value="${editing? (p.paidAmount||0) : 0}"></div>
    <button class="btn primary" id="saveContract">${editing?'حفظ التعديلات':'إنشاء العقد'}</button>
    ${editing?`<button class="btn ghost" id="delContract">حذف العقد</button>`:''}`;
  overlay.classList.add('show');
  askNotifPermission();

  const typeSel = document.getElementById('f_cType');
  const dailyDiv = document.getElementById('dailyFields');
  const openDiv = document.getElementById('openFields');
  const monthlyDiv = document.getElementById('monthlyFields');
  const startLabel = document.getElementById('f_cStartLabel');
  function toggleType(){
    const v = typeSel.value;
    dailyDiv.style.display = v==='daily' ? 'block':'none';
    openDiv.style.display = v==='daily_open' ? 'block':'none';
    monthlyDiv.style.display = v==='monthly' ? 'block':'none';
    startLabel.textContent = v==='monthly' ? 'تاريخ بداية العقد الشهري' : (v==='daily_open' ? 'تاريخ بداية الإيجار' : 'تاريخ التسليم');
  }
  typeSel.addEventListener('change', toggleType);
  toggleType();

  document.getElementById('saveContract').onclick = ()=>{
    const cType = typeSel.value;
    const carId = document.getElementById('f_cCar').value;
    const customerId = document.getElementById('f_cCust').value;
    const startDate = document.getElementById('f_cStart').value;
    if(!startDate){ showToast('حدد تاريخ البداية'); return; }
    const startOdoVal = document.getElementById('f_cStartOdo').value;
    const kmLimitVal = document.getElementById('f_cKmLimit').value;
    const startOdometer = startOdoVal? Number(startOdoVal) : null;
    const kmLimit = kmLimitVal? Number(kmLimitVal) : null;
    const paidAmount = Number(document.getElementById('f_cPaid').value)||0;

    let payload = {carId, customerId, startDate, type:cType, startOdometer, kmLimit};
    if(cType==='monthly'){
      payload.monthlyRate = Number(document.getElementById('f_cMonthly').value)||0;
      payload.endDate = null; payload.dailyRate = 0; payload.totalAmount = 0;
    } else if(cType==='daily_open'){
      payload.dailyRate = Number(document.getElementById('f_cOpenRate').value)||0;
      payload.endDate = null; payload.totalAmount = 0;
    } else {
      const endDate = document.getElementById('f_cEnd').value;
      if(!endDate){ showToast('حدد تاريخ الاستلام المتوقع'); return; }
      if(endDate<startDate){ showToast('تاريخ الاستلام قبل التسليم!'); return; }
      payload.endDate = endDate;
      payload.dailyRate = Number(document.getElementById('f_cRate').value)||0;
      payload.totalAmount = Number(document.getElementById('f_cTotal').value)||0;
    }

    if(editing){
      Object.assign(contract, payload, {paidAmount});
    } else {
      const id = uid();
      state.contracts.push(Object.assign({id, status:'active', paidAmount:0}, payload));
      if(paidAmount>0){
        state.payments.push({id:uid(), contractId:id, amount:paidAmount, date:todayStr()});
        const nc = state.contracts.find(x=>x.id===id); nc.paidAmount = paidAmount;
      }
      const car = state.cars.find(c=>c.id===carId); if(car) car.status='rented';
      if(p.bookingId) state.bookings = state.bookings.filter(b=>b.id!==p.bookingId);
    }
    saveData(); closeSheet(); setView('rental_active'); showToast(editing?'تم حفظ التعديلات':'تم إنشاء العقد');
  };
  if(editing) document.getElementById('delContract').onclick = ()=>{
    if(!confirm('هل تريد حذف هذا العقد نهائيًا؟')) return;
    state.contracts = state.contracts.filter(c=>c.id!==contract.id);
    saveData(); closeSheet(); render(); showToast('تم حذف العقد');
  };
}
function openContractDetail(id){
  const c = state.contracts.find(x=>x.id===id);
  if(!c) return;
  if(c.status==='completed'){ openContractForm(c); return; }
  const isMonthly = c.type==='monthly';
  const isOpen = c.type==='daily_open';
  const cyc = isMonthly? monthlyCycle(c) : null;
  const os = isOpen? dailyOpenSummary(c) : null;
  sheet.innerHTML = `
    <div class="sheet-close">— تفاصيل العقد —</div>
    <h2>${carName(c.carId)}</h2>
    <div class="field"><label>العميل</label><input value="${custName(c.customerId)}" disabled></div>
    ${isMonthly ? `
    <div class="row2">
      <div class="field"><label>الإيجار الشهري</label><input value="${fmtMoney(c.monthlyRate)}" disabled></div>
      <div class="field"><label>مدفوع هذا الشهر</label><input value="${fmtMoney(cyc.paid)}" disabled></div>
    </div>
    <div class="field"><label>التجديد القادم</label><input value="${fmtDate(cyc.cycleEnd)}" disabled></div>
    ` : isOpen ? `
    <div class="row2">
      <div class="field"><label>عدد الأيام حتى الآن</label><input value="${os.days} يوم" disabled></div>
      <div class="field"><label>الإجمالي المستحق</label><input value="${fmtMoney(os.totalDue)}" disabled></div>
    </div>
    <div class="field"><label>المتبقي</label><input value="${fmtMoney(os.balance)}" disabled></div>
    ` : `
    <div class="row2">
      <div class="field"><label>الإجمالي</label><input value="${fmtMoney(c.totalAmount)}" disabled></div>
      <div class="field"><label>المدفوع</label><input value="${fmtMoney(c.paidAmount)}" disabled></div>
    </div>
    `}
    ${c.kmLimit? `<div class="field"><label>حد الكيلومترات</label><input value="${c.kmLimit} كم" disabled></div>`:''}
    <button class="btn primary" id="addPaymentBtn">تسجيل دفعة جديدة</button>
    ${isMonthly
      ? `<button class="btn ghost" id="endBtn" style="color:var(--rust);">إنهاء العقد الشهري</button>`
      : isOpen
      ? `<button class="btn primary" style="background:var(--pine);" id="endOpenBtn">إنهاء الإيجار وتسجيل التصفية</button>`
      : `<button class="btn primary" style="background:var(--pine);" id="returnBtn">تسجيل إرجاع السيارة</button>`}
    <button class="btn secondary" id="editContractBtn">تعديل بيانات العقد</button>
    <button class="btn secondary" id="shareBtn" style="background:#25D366;">مشاركة العقد عبر واتساب</button>`;
  overlay.classList.add('show');
  if(isMonthly) document.getElementById('endBtn').onclick = ()=>{ closeSheet(); endMonthlyContract(c.id); };
  else if(isOpen) document.getElementById('endOpenBtn').onclick = ()=>{ closeSheet(); openOpenRentalEndForm(c.id); };
  else document.getElementById('returnBtn').onclick = ()=>{ closeSheet(); openReturnForm(c.id); };
  document.getElementById('editContractBtn').onclick = ()=> openContractForm(c);
  document.getElementById('addPaymentBtn').onclick = ()=> openPaymentForm(c);
  document.getElementById('shareBtn').onclick = ()=> shareContractWhatsApp(c);
}

/* --- مشاركة عبر واتساب --- */
function shareContractWhatsApp(c){
  const isMonthly = c.type==='monthly';
  const isOpen = c.type==='daily_open';
  const lines = ['تفاصيل عقد التأجير', `السيارة: ${carName(c.carId)}`, `العميل: ${custName(c.customerId)}`];
  if(isMonthly){
    const cyc = monthlyCycle(c);
    lines.push('نوع العقد: شهري (يتجدد تلقائيًا)');
    lines.push(`تاريخ البداية: ${fmtDate(c.startDate)}`);
    lines.push(`الإيجار الشهري: ${fmtMoney(c.monthlyRate)}`);
    lines.push(`التجديد القادم: ${fmtDate(cyc.cycleEnd)}`);
  } else if(isOpen){
    const os = dailyOpenSummary(c);
    lines.push('نوع العقد: يومي مفتوح');
    lines.push(`تاريخ البداية: ${fmtDate(c.startDate)}`);
    lines.push(`السعر اليومي: ${fmtMoney(c.dailyRate)}`);
    lines.push(`عدد الأيام حتى الآن: ${os.days}`);
    lines.push(`الإجمالي المستحق: ${fmtMoney(os.totalDue)}`);
    lines.push(`المتبقي: ${fmtMoney(os.balance)}`);
  } else {
    lines.push(`تاريخ التسليم: ${fmtDate(c.startDate)}`);
    lines.push(`تاريخ الاستلام المتوقع: ${fmtDate(c.endDate)}`);
    if(c.totalAmount) lines.push(`الإجمالي: ${fmtMoney(c.totalAmount)}`);
    lines.push(`المدفوع: ${fmtMoney(c.paidAmount)}`);
  }
  if(c.kmLimit) lines.push(`الحد الأقصى للكيلومترات: ${c.kmLimit} كم`);
  if(c.startOdometer) lines.push(`قراءة العداد عند التسليم: ${c.startOdometer}`);
  if(state.settings.companyName) lines.push('', state.settings.companyName);
  const text = encodeURIComponent(lines.join('\n'));
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

/* --- حجز --- */
function openBookingForm(){
  if(state.cars.length===0 || state.customers.length===0){ showToast('أضف سيارة وعميل أولًا'); return; }
  const carsOpts = state.cars.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const custOpts = state.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sheet.innerHTML = `
    <div class="sheet-close">— حجز جديد —</div>
    <h2>إضافة حجز مسبق</h2>
    <div class="field"><label>السيارة</label><select id="f_bCar">${carsOpts}</select></div>
    <div class="field"><label>العميل</label><select id="f_bCust">${custOpts}</select></div>
    <div class="row2">
      <div class="field"><label>من تاريخ</label><input type="date" id="f_bStart" value="${todayStr()}"></div>
      <div class="field"><label>إلى تاريخ</label><input type="date" id="f_bEnd"></div>
    </div>
    <button class="btn primary" id="saveBooking">حفظ الحجز</button>`;
  overlay.classList.add('show');
  document.getElementById('saveBooking').onclick = ()=>{
    const carId = document.getElementById('f_bCar').value;
    const customerId = document.getElementById('f_bCust').value;
    const startDate = document.getElementById('f_bStart').value;
    const endDate = document.getElementById('f_bEnd').value;
    if(!startDate||!endDate){ showToast('حدد التاريخين'); return; }
    if(endDate<startDate){ showToast('تاريخ النهاية قبل البداية!'); return; }
    state.bookings.push({id:uid(), carId, customerId, startDate, endDate, status:'pending'});
    saveData(); closeSheet(); render(); showToast('تم حفظ الحجز');
  };
}

/* --- صيانة --- */
function openMaintenanceForm(){
  if(state.cars.length===0){ showToast('أضف سيارة أولًا'); return; }
  const carsOpts = state.cars.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  sheet.innerHTML = `
    <div class="sheet-close">— سجل صيانة —</div>
    <h2>إضافة سجل صيانة</h2>
    <div class="field"><label>السيارة</label><select id="f_mCar">${carsOpts}</select></div>
    <div class="field"><label>الوصف</label><input id="f_mDesc" placeholder="تغيير زيت، فرامل..."></div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input type="date" id="f_mDate" value="${todayStr()}"></div>
      <div class="field"><label>التكلفة (${cur()})</label><input type="number" id="f_mCost"></div>
    </div>
    <div class="field"><label>نقل السيارة لحالة "صيانة"؟</label><select id="f_mSetStatus"><option value="yes">نعم</option><option value="no">لا</option></select></div>
    <button class="btn primary" id="saveMaint">حفظ السجل</button>`;
  overlay.classList.add('show');
  document.getElementById('saveMaint').onclick = ()=>{
    const carId = document.getElementById('f_mCar').value;
    const description = document.getElementById('f_mDesc').value.trim();
    const date = document.getElementById('f_mDate').value || todayStr();
    const cost = Number(document.getElementById('f_mCost').value)||0;
    state.maintenance.push({id:uid(), carId, description, date, cost});
    if(document.getElementById('f_mSetStatus').value==='yes'){
      const car = state.cars.find(c=>c.id===carId); if(car) car.status='maintenance';
    }
    saveData(); closeSheet(); render(); showToast('تم حفظ سجل الصيانة');
  };
}

/* --- مصروف --- */
function openExpenseForm(){
  sheet.innerHTML = `
    <div class="sheet-close">— مصروف جديد —</div>
    <h2>إضافة مصروف</h2>
    <div class="field"><label>البند</label><input id="f_eCat" placeholder="وقود، تأمين، إيجار مكتب..."></div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input type="date" id="f_eDate" value="${todayStr()}"></div>
      <div class="field"><label>المبلغ (${cur()})</label><input type="number" id="f_eAmount"></div>
    </div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="f_eNote"></div>
    <button class="btn primary" id="saveExpense">حفظ المصروف</button>`;
  overlay.classList.add('show');
  document.getElementById('saveExpense').onclick = ()=>{
    const category = document.getElementById('f_eCat').value.trim() || 'مصروف عام';
    const date = document.getElementById('f_eDate').value || todayStr();
    const amount = Number(document.getElementById('f_eAmount').value)||0;
    const note = document.getElementById('f_eNote').value.trim();
    if(amount<=0){ showToast('أدخل مبلغًا صحيحًا'); return; }
    state.expenses.push({id:uid(), category, date, amount, note});
    saveData(); closeSheet(); render(); showToast('تم حفظ المصروف');

/* --- دفعة --- */
function openPaymentForm(preselectedContract){
  const activeContracts = state.contracts.filter(c=>c.status==='active' || c.status==='completed');
  if(activeContracts.length===0){ showToast('لا توجد عقود لتسجيل دفعة عليها'); return; }
  const opts = activeContracts.map(c=>`<option value="${c.id}" ${preselectedContract&&preselectedContract.id===c.id?'selected':''}>${carName(c.carId)} — ${custName(c.customerId)}</option>`).join('');
  sheet.innerHTML = `
    <div class="sheet-close">— دفعة جديدة —</div>
    <h2>تسجيل دفعة</h2>
    <div class="field"><label>العقد</label><select id="f_pContract">${opts}</select></div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input type="date" id="f_pDate" value="${todayStr()}"></div>
      <div class="field"><label>المبلغ (${cur()})</label><input type="number" id="f_pAmount"></div>
    </div>
    <button class="btn primary" id="savePayment">حفظ الدفعة</button>`;
  overlay.classList.add('show');
  document.getElementById('savePayment').onclick = ()=>{
    const contractId = document.getElementById('f_pContract').value;
    const date = document.getElementById('f_pDate').value || todayStr();
    const amount = Number(document.getElementById('f_pAmount').value)||0;
    if(amount<=0){ showToast('أدخل مبلغًا صحيحًا'); return; }
    state.payments.push({id:uid(), contractId, amount, date});
    const c = state.contracts.find(x=>x.id===contractId);
    if(c) c.paidAmount = Number(c.paidAmount||0) + amount;
    saveData(); closeSheet(); render(); showToast('تم تسجيل الدفعة');
  };
}

/* --- بحث سريع --- */
function openSearch(){
  sheet.innerHTML = `
    <div class="sheet-close">— بحث سريع —</div>
    <h2>ابحث بالاسم، رقم اللوحة، أو الجوال</h2>
    <div class="field"><input id="f_search" placeholder="اكتب للبحث..." autocomplete="off"></div>
    <div id="searchResults"></div>`;
  overlay.classList.add('show');
  const input = document.getElementById('f_search');
  setTimeout(()=>input.focus(), 100);
  input.addEventListener('input', ()=> renderSearchResults(input.value.trim()));
  renderSearchResults('');
}
function renderSearchResults(q){
  const box = document.getElementById('searchResults');
  if(!q){ box.innerHTML = `<div class="empty">اكتب اسم عميل، رقم لوحة، أو رقم جوال.</div>`; return; }
  const ql = q.toLowerCase();
  const carMatches = state.cars.filter(c=>(c.name||'').toLowerCase().includes(ql) || (c.plate||'').toLowerCase().includes(ql));
  const custMatches = state.customers.filter(c=>(c.name||'').toLowerCase().includes(ql) || (c.phone||'').includes(q));
  let html = '';
  if(carMatches.length){
    html += `<div class="section-title"><span class="dot slate"></span>سيارات</div>`;
    carMatches.forEach(c=> html += `<div class="list-row" onclick="closeSheet(); openCarForm(findCar('${c.id}'))"><div><div class="main">${c.name}</div><div class="sub">${c.plate||''}</div></div><span class="badge ${statusCls[c.status]}">${statusAr[c.status]}</span></div>`);
  }
  if(custMatches.length){
    html += `<div class="section-title"><span class="dot slate"></span>عملاء</div>`;
    custMatches.forEach(c=> html += `<div class="list-row" onclick="closeSheet(); openCustomerForm(findCustomer('${c.id}'))"><div><div class="main">${c.name}</div><div class="sub">${c.phone||''}</div></div></div>`);
  }
  const contractMatches = state.contracts.filter(ct=> carMatches.some(c=>c.id===ct.carId) || custMatches.some(c=>c.id===ct.customerId));
  if(contractMatches.length){
    html += `<div class="section-title"><span class="dot slate"></span>عقود</div>`;
    contractMatches.forEach(ct=> html += `<div class="list-row" onclick="closeSheet(); openContractDetail('${ct.id}')"><div><div class="main">${carName(ct.carId)}</div><div class="sub">${custName(ct.customerId)}</div></div></div>`);
  }
  if(!html) html = `<div class="empty">لا توجد نتائج مطابقة.</div>`;
  box.innerHTML = html;
}
document.getElementById('searchBtn').addEventListener('click', openSearch);

/* ================= تشغيل أولي ================= */
setView('home');
askNotifPermission();
checkAndNotify();
setInterval(checkAndNotify, 60*1000);
initCloudSync();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    try{
      const swCode = `
        const CACHE = 'car-rental-v1';
        self.addEventListener('install', (e)=>{ self.skipWaiting(); });
        self.addEventListener('activate', (e)=>{ self.clients.claim(); });
        self.addEventListener('fetch', (e)=>{
          e.respondWith(
            caches.open(CACHE).then(async (cache)=>{
              const cached = await cache.match(e.request);
              if(cached) return cached;
              try{
                const res = await fetch(e.request);
                if(e.request.method==='GET') cache.put(e.request, res.clone());
                return res;
              }catch(err){ return cached || Response.error(); }
            })
          );
        });
      `;
      const blob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }catch(e){}
  });
}
